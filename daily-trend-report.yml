name: Deep Pockets Daily Trend Report

on:
  schedule:
    # Runs at 06:00 IST every day.
    # Cron is in UTC, IST = UTC+5:30, so 06:00 IST = 00:30 UTC.
    - cron: '30 0 * * *'
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the report back to the repo

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        run: python deep_pockets_tracker.py

      - name: Commit report files back to repo
        run: |
          git config user.name "Deep Pockets Bot"
          git config user.email "bot@deeppockets.local"
          git add trend_report_*.csv digest_*.md
          git diff --cached --quiet || git commit -m "Daily trend report $(date +'%Y-%m-%d')"
          git push

      # ---------------------------------------------------------------
      # OPTIONAL: email yourself the digest every morning.
      # To enable, uncomment the block below and add these repo secrets
      # (Settings -> Secrets and variables -> Actions -> New repository secret):
      #   MAIL_USERNAME  -> your Gmail address
      #   MAIL_PASSWORD  -> a Gmail "App Password" (not your normal password)
      #   MAIL_TO        -> where you want the digest sent (can be same address)
      # ---------------------------------------------------------------
      # - name: Email digest
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 465
      #     username: ${{ secrets.MAIL_USERNAME }}
      #     password: ${{ secrets.MAIL_PASSWORD }}
      #     subject: "Deep Pockets — Trend Report"
      #     to: ${{ secrets.MAIL_TO }}
      #     from: Deep Pockets Bot
      #     body: "Attached: today's ranked keyword trend report and digest."
      #     attachments: trend_report_*.csv,digest_*.md
