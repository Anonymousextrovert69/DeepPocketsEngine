name: Deep Pockets Daily Trend Tracker

on:
  schedule:
    # 01:30 UTC = 07:00 IST, daily. Cron on Actions is UTC only.
    # Note: scheduled runs can be delayed by several minutes to an hour
    # when GitHub is busy, and are auto-disabled after 60 days of no
    # repo activity — the daily commit step below keeps it alive.
    - cron: "30 1 * * *"
  workflow_dispatch:        # lets you trigger a run manually from the UI

permissions:
  contents: write           # needed to commit the reports back

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python deep_pockets_tracker.py

      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend-report-${{ github.run_number }}
          path: output/
          retention-days: 90

      - name: Commit reports to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Trend report $(date -u +%Y-%m-%d)"
          git push

  # Runs weekly to tell you which feeds have gone dead, so the tracker
  # doesn't quietly degrade as publishers change their URLs.
  feed-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * 1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check feed health
        continue-on-error: true    # report, don't fail the whole run
        run: python deep_pockets_tracker.py --check-feeds
